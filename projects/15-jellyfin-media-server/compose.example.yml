services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${JELLYFIN_UID:?Set JELLYFIN_UID}:${JELLYFIN_GID:?Set JELLYFIN_GID}"
    ports:
      - "8096:8096/tcp"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /srv/media:/media:ro
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
