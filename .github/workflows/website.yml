name: Website build and publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Test homepage generation and deployment
        shell: powershell
        run: ./scripts/test-website-workflow.ps1
      - name: Run AUT-002 for the public build
        shell: powershell
        run: |
          ./scripts/update-homepage-latest.ps1 -WebsiteFolder ./website
          ./scripts/update-homepage-latest.ps1 -WebsiteFolder ./website -Check
      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website/

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: website/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/
      - name: Publish generated website
        id: deployment
        uses: actions/deploy-pages@v4
